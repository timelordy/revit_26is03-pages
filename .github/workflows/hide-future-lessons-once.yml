name: Hide future Revit lessons once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-future-lessons-once.yml

permissions:
  contents: write

jobs:
  patch-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restrict visible lessons
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          old = "const firstSemesterLessons = () => REVIT_LESSONS.filter(lesson => lesson.semester === 1);"
          new = "const firstSemesterLessons = () => REVIT_LESSONS.filter(lesson => lesson.semester === 1 && lesson.number <= 2);"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text and 'id="lesson-visibility-lock"' not in text:
              shim = r'<script id="lesson-visibility-lock">(()=>{const a=new Set;function f(){a.clear();document.querySelectorAll(".guide-lesson-link[data-action=guide-lesson]").forEach(e=>{const m=e.textContent.match(/Урок\s*0*(\d+)/i);m?(+m[1]<=2?(a.add(e.dataset.id),e.hidden=false):e.hidden=true):a.add(e.dataset.id)});document.querySelectorAll("[data-action=guide-lesson]:not(.guide-lesson-link)").forEach(e=>{a.size&&e.dataset.id&&!a.has(e.dataset.id)&&(e.hidden=true)})}document.addEventListener("click",e=>{const t=e.target.closest?.("[data-action=guide-lesson]");t&&a.size&&t.dataset.id&&!a.has(t.dataset.id)&&(e.preventDefault(),e.stopImmediatePropagation())},true);new MutationObserver(f).observe(document.body,{childList:true,subtree:true});f()})();</script>'
              if "</body>" not in text:
                  raise SystemExit("No safe insertion point in index.html")
              text = text.replace("</body>", shim + "</body>", 1)

          index.write_text(text, encoding="utf-8")
          Path(".github/workflows/hide-future-lessons-once.yml").unlink()

      - name: Commit public site update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/hide-future-lessons-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Hide Revit lessons after lesson 2"
          git push
