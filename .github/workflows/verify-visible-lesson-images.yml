name: Verify visible lesson images
on:
  push:
    branches: [lesson-01-visible-images-20260913]
    paths: [.github/workflows/verify-visible-lesson-images.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire visual assets into the public page
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/lesson-01-visuals.css?v=2">'
          js='<script src="assets/lesson-01-visuals.js?v=2"></script>'
          if css not in text:
              text=text.replace('</head>',css+'</head>',1)
          if js not in text:
              markers=['<script src="assets/lesson-01.js?v=1"></script>','<script src="assets/lesson-01.js"></script>']
              for marker in markers:
                  if marker in text:
                      text=text.replace(marker,marker+js,1)
                      break
              else:
                  raise SystemExit('lesson-01.js marker not found')
          path.write_text(text,encoding='utf-8')
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check assets/lesson-01-visuals.js
      - name: Test images, topics and existing application state
        shell: python
        run: |
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright,expect
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory='.'))
          Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto(f'http://127.0.0.1:{server.server_port}/',wait_until='networkidle')
                  page.wait_for_function('window.S40 && window.S40Lesson01 && window.S40Lesson01Visuals')
                  initial=page.evaluate('JSON.stringify(S40.getState())')
                  page.locator('[data-tab="guide"]').click()
                  page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
                  expect(page.locator('.r1-visible-gallery img')).to_have_count(3)
                  expect(page.locator('.r1-summary-thumb img')).to_have_count(8)
                  expect(page.locator('.r1-topic-visual img')).to_have_count(8)
                  expect(page.locator('#r1-why')).to_have_attribute('open','')
                  page.locator('[data-r1-expand]').click()
                  page.locator('.r1-lesson img').evaluate_all('(images)=>images.forEach(img=>img.loading="eager")')
                  page.wait_for_function('Array.from(document.querySelectorAll(".r1-lesson img")).every(img=>img.complete && img.naturalWidth>0)',timeout=45000)
                  assert page.locator('.r1-image-failed').count()==0
                  assert page.evaluate('JSON.stringify(S40.getState())')==initial
                  for width in [360,390,768,1440]:
                      page.set_viewport_size({'width':width,'height':900})
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),width
                  page.set_viewport_size({'width':1440,'height':1000})
                  page.locator('.r1-lesson').screenshot(path='lesson-01-visible-images.png')
                  assert not errors,errors
                  browser.close()
          finally:
              server.shutdown()
      - name: Save browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: lesson-01-visible-images
          path: lesson-01-visible-images.png
          retention-days: 7
      - name: Commit tested page wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Show images throughout lesson 1'
            git push
          fi
