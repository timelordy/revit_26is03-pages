name: Cleanup temporary lesson shim once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-lesson-shim-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove temporary compatibility shim
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          shim = r'<script id="lesson-visibility-lock">(()=>{const a=new Set;function f(){a.clear();document.querySelectorAll(".guide-lesson-link[data-action=guide-lesson]").forEach(e=>{const m=e.textContent.match(/Урок\s*0*(\d+)/i);m?(+m[1]<=2?(a.add(e.dataset.id),e.hidden=false):e.hidden=true):a.add(e.dataset.id)});document.querySelectorAll("[data-action=guide-lesson]:not(.guide-lesson-link)").forEach(e=>{a.size&&e.dataset.id&&!a.has(e.dataset.id)&&(e.hidden=true)})}document.addEventListener("click",e=>{const t=e.target.closest?.("[data-action=guide-lesson]");t&&a.size&&t.dataset.id&&!a.has(t.dataset.id)&&(e.preventDefault(),e.stopImmediatePropagation())},true);new MutationObserver(f).observe(document.body,{childList:true,subtree:true});f()})();</script>'
          count = text.count(shim)
          if count > 1:
              raise SystemExit(f"Unexpected shim count: {count}")
          if count == 1:
              index.write_text(text.replace(shim, "", 1), encoding="utf-8")

          Path(".github/workflows/cleanup-lesson-shim-once.yml").unlink()

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/cleanup-lesson-shim-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary lesson visibility shim"
          git push
