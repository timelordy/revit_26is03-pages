name: Verify public linear lesson 1 onboarding
on:
  push:
    branches: [lesson-01-linear-onboarding-20260913]
    paths:
      - assets/lesson-01-walkthrough.js
      - assets/lesson-01-walkthrough.css
      - .github/workflows/verify-lesson-01-linear.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire the walkthrough into the public page
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/lesson-01-walkthrough.css?v=1">'
          js='<script src="assets/lesson-01-walkthrough.js?v=1"></script>'
          if css not in text:
              text=text.replace('</head>',css+'</head>',1)
          if js not in text:
              marker='<script src="assets/lesson-01-visuals.js?v=5"></script>'
              if marker not in text:
                  raise SystemExit('Visual lesson script marker not found')
              text=text.replace(marker,marker+js,1)
          path.write_text(text,encoding='utf-8')
          if text.count('lesson-01-walkthrough.js')!=1 or text.count('lesson-01-walkthrough.css')!=1:
              raise SystemExit('Walkthrough assets duplicated or missing')
      - name: Install browser test tools
        run: |
          node --check assets/lesson-01-walkthrough.js
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test the public lesson locally
        shell: python
        run: |
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright,expect
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory='.'))
          Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[];page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto(f'http://127.0.0.1:{server.server_port}/',wait_until='networkidle')
                  page.wait_for_function('window.S40 && window.S40Lesson01Walkthrough')
                  initial=page.evaluate('JSON.stringify(S40.getState())')
                  page.locator('[data-tab="guide"]').click()
                  page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
                  expect(page.locator('.r1w-shell')).to_be_visible()
                  expect(page.locator('.r1w-nav button')).to_have_count(10)
                  expect(page.locator('.r1w-step-head h3')).to_have_text('Открой Revit 2024')
                  assert page.locator('.r1-topic').count()==0
                  page.locator('[data-r1w-next]').click()
                  expect(page.locator('.r1w-step-head h3')).to_have_text('Создай пустой учебный проект')
                  page.locator('[data-r1w-goto="4"]').click()
                  expect(page.locator('.r1w-step-head h3')).to_have_text('Построй одну стену')
                  page.locator('[data-r1w-goto="8"]').click()
                  expect(page.locator('.r1w-step-head h3')).to_contain_text('RVT, RTE и RFA')
                  expect(page.locator('.r1w-files')).to_be_visible()
                  page.locator('[data-r1w-goto="9"]').click()
                  expect(page.locator('.r1w-final-list label')).to_have_count(5)
                  for width in [360,390,768,1440]:
                      page.set_viewport_size({'width':width,'height':900})
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),width
                  page.set_viewport_size({'width':1440,'height':1000})
                  page.locator('button[data-action="guide-lesson"][data-id="navigation"]').first.click()
                  assert page.locator('.live-lesson-points li').count()==11
                  assert page.evaluate('JSON.stringify(S40.getState())')==initial
                  assert not errors,errors
                  page.close();browser.close()
          finally:
              server.shutdown()
      - name: Commit tested public wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Wire linear lesson 1 onboarding'
            git push
          fi
