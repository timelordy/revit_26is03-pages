<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Файлы Revit RVT, RTE и RFA</title><desc id="desc">Три карточки показывают проект, шаблон и семейство.</desc>
<defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#6c8276}.accent{fill:#bd5938}.blue{fill:#e4eef3}.green{fill:#e8efe2}.sand{fill:#f5eadf}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 36px system-ui,sans-serif}.ext{font:800 54px system-ui,sans-serif}.t{font:500 23px system-ui,sans-serif}.s{font:700 25px system-ui,sans-serif}</style></defs>
<rect class="bg" width="1200" height="675" rx="28"/>
<text class="ink h" x="60" y="72">Три расширения без мистики</text><text class="muted t" x="60" y="112">Сначала пойми, что за файл перед тобой. Потом уже нажимай всё подряд.</text>
<g transform="translate(60 165)"><rect class="card" width="330" height="420" rx="24"/><rect class="blue" x="24" y="24" width="282" height="112" rx="18"/><text class="accent ext" x="54" y="100">.RVT</text><path class="line" d="M225 48h44v62h-44zM235 60h24M235 74h24M235 88h17"/><text class="ink s" x="34" y="184">Проект</text><text class="muted t" x="34" y="226">Дом, виды, листы,</text><text class="muted t" x="34" y="259">таблицы и данные.</text><text class="ink s" x="34" y="322">Что делаем</text><text class="muted t" x="34" y="361">Открываем и работаем.</text><text class="muted t" x="34" y="394">Это основной файл.</text></g>
<g transform="translate(435 165)"><rect class="card" width="330" height="420" rx="24"/><rect class="green" x="24" y="24" width="282" height="112" rx="18"/><text class="accent ext" x="54" y="100">.RTE</text><path class="line" d="M220 99V53h54v57M231 53V38h32v15M234 76h26"/><text class="ink s" x="34" y="184">Шаблон проекта</text><text class="muted t" x="34" y="226">Стартовые настройки,</text><text class="muted t" x="34" y="259">типы, виды и единицы.</text><text class="ink s" x="34" y="322">Что делаем</text><text class="muted t" x="34" y="361">Создаём из него RVT.</text><text class="muted t" x="34" y="394">Сам дом тут не ведём.</text></g>
<g transform="translate(810 165)"><rect class="card" width="330" height="420" rx="24"/><rect class="sand" x="24" y="24" width="282" height="112" rx="18"/><text class="accent ext" x="54" y="100">.RFA</text><path class="line" d="M220 108V48h58v60M230 108V65h38v43M244 108V82h12v26"/><text class="ink s" x="34" y="184">Семейство</text><text class="muted t" x="34" y="226">Отдельный объект:</text><text class="muted t" x="34" y="259">дверь, окно, мебель.</text><text class="ink s" x="34" y="322">Что делаем</text><text class="muted t" x="34" y="361">Загружаем в проект.</text><text class="muted t" x="34" y="394">Не путаем с RVT.</text></g>
</svg>
