name: Verify live lesson 1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lesson-01-live-check.yml
      - assets/lesson-01.js
      - assets/lesson-01.css
      - assets/lesson-01-visuals.js
      - assets/lesson-01-visuals.css
      - assets/lesson-01-walkthrough.js
      - assets/lesson-01-walkthrough.css
      - assets/lesson-01/**
      - index.html
      - lessons-live.js
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for the matching Pages assets
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request,urlopen
          import os,time
          root='https://timelordy.github.io/revit_26is03-pages/'
          files=[
              'assets/lesson-01-walkthrough.js',
              'assets/lesson-01-walkthrough.css',
              'assets/lesson-01/model-views.svg',
              'assets/lesson-01/file-types.svg',
              'assets/lesson-01/interface.png',
              'assets/lesson-01/browser.png',
              'assets/lesson-01/properties.png',
          ]
          for attempt in range(30):
              try:
                  for name in files:
                      req=Request(root+name+'?verify='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urlopen(req,timeout=15) as response:
                          actual=response.read()
                      assert actual==Path(name).read_bytes(),name
                  with urlopen(root+'?verify='+os.environ['GITHUB_SHA'],timeout=15) as response:
                      html=response.read()
                  assert b'lesson-01-walkthrough.js?v=1' in html
                  assert b'lesson-01-walkthrough.css?v=1' in html
                  print('Live Pages HTML and linear lesson assets match the checked-out commit')
                  break
              except Exception as error:
                  if attempt==29:
                      raise
                  print('Waiting for Pages:',type(error).__name__)
                  time.sleep(10)
      - name: Check the linear guide on the actual public URL
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          url='https://timelordy.github.io/revit_26is03-pages/?linear=1'
          out=Path('lesson-01-live-qa');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              page.goto(url,wait_until='networkidle',timeout=60000)
              page.wait_for_function('window.S40 && window.S40Lesson01Walkthrough')
              initial=page.evaluate('JSON.stringify(S40.getState())')
              page.locator('[data-tab="guide"]').click()
              page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
              expect(page.locator('.r1w-shell')).to_be_visible()
              expect(page.locator('.r1w-nav button')).to_have_count(10)
              expect(page.locator('.r1w-step-head h3')).to_have_text('Открой Revit 2024')
              assert page.locator('.r1-topic').count()==0
              page.locator('[data-r1w-next]').click()
              expect(page.locator('.r1w-step-head h3')).to_have_text('Создай пустой учебный проект')
              page.locator('[data-r1w-goto="4"]').click()
              expect(page.locator('.r1w-step-head h3')).to_have_text('Построй одну стену')
              page.locator('[data-r1w-goto="5"]').click()
              expect(page.locator('.r1w-step-head h3')).to_contain_text('открой 3D')
              expect(page.locator('.r1w-figure img')).to_be_visible()
              page.locator('[data-r1w-goto="8"]').click()
              expect(page.locator('.r1w-step-head h3')).to_contain_text('RVT, RTE и RFA')
              expect(page.locator('.r1w-files')).to_be_visible()
              page.locator('[data-r1w-goto="9"]').click()
              expect(page.locator('.r1w-final-list label')).to_have_count(5)
              assert page.evaluate('JSON.stringify(S40.getState())')==initial
              for width in [360,390,768,1440]:
                  page.set_viewport_size({'width':width,'height':900})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),width
              page.set_viewport_size({'width':1440,'height':1000})
              page.locator('button[data-action="guide-lesson"][data-id="navigation"]').first.click()
              assert page.locator('.live-lesson-points li').count()==11
              page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
              page.locator('.r1w-shell').screenshot(path=str(out/'lesson-01-linear-live.png'))
              assert not errors,errors
              browser.close()
          print('Linear Lesson 1 verified on the live site')
      - name: Save live UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-01-live-linear-verification
          path: lesson-01-live-qa/
          retention-days: 7
