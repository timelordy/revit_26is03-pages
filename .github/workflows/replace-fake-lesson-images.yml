name: Replace public fake lesson images
on:
  push:
    branches: [main]
    paths: [.github/workflows/replace-fake-lesson-images.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public lesson assets
        run: python .github/replace_fake_lesson_images.py
      - name: Install browser test tools
        run: |
          node --check assets/lesson-01-walkthrough.js
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify the public lesson locally
        shell: python
        run: |
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright,expect
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory='.'))
          Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[];page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto(f'http://127.0.0.1:{server.server_port}/',wait_until='networkidle')
                  page.wait_for_function('window.S40 && window.S40Lesson01Walkthrough')
                  initial=page.evaluate('JSON.stringify(S40.getState())')
                  page.locator('[data-tab="guide"]').click()
                  page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
                  expect(page.locator('.r1w-shell')).to_be_visible()
                  img=page.locator('img[src$="revit-home-2024.png"]')
                  expect(img).to_be_visible()
                  page.wait_for_function("document.querySelector('img[src$=\"revit-home-2024.png\"]')?.naturalWidth>0")
                  assert page.locator('.r1w-home-mock').count()==0
                  page.locator('[data-r1w-goto="1"]').click()
                  assert page.locator('img[src$="template-flow.svg"]').count()==0
                  page.locator('[data-r1w-goto="5"]').click()
                  img3=page.locator('img[src$="revit-3d-example.png"]')
                  expect(img3).to_be_visible()
                  page.wait_for_function("document.querySelector('img[src$=\"revit-3d-example.png\"]')?.naturalWidth>0")
                  page.locator('[data-r1w-goto="7"]').click()
                  assert page.locator('img[src$="save-flow.svg"]').count()==0
                  page.locator('[data-r1w-goto="8"]').click()
                  assert page.locator('img[src$="file-types.svg"]').count()==0
                  expect(page.locator('.r1w-files')).to_be_visible()
                  assert page.evaluate('JSON.stringify(S40.getState())')==initial
                  for width in [360,390,768,1440]:
                      page.set_viewport_size({'width':width,'height':900})
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),width
                  page.set_viewport_size({'width':1440,'height':1000})
                  page.locator('button[data-action="guide-lesson"][data-id="navigation"]').first.click()
                  assert page.locator('.live-lesson-points li').count()==11
                  assert not errors,errors
                  browser.close()
          finally:
              server.shutdown()
          print('Real Revit screenshots verified; fake walkthrough diagrams removed')
      - name: Commit tested public result
        run: |
          rm .github/workflows/replace-fake-lesson-images.yml .github/replace_fake_lesson_images.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/lesson-01-walkthrough.js assets/lesson-01-walkthrough.css assets/lesson-01/revit-home-2024.png assets/lesson-01/revit-3d-example.png assets/lesson-01/official-screenshots.json .github/workflows/replace-fake-lesson-images.yml .github/replace_fake_lesson_images.py
          git commit -m 'Use real Revit screenshots in public lesson 1'
          git push
