name: Clarify Revit file types on Pages
on:
  push:
    branches: [clarify-revit-files-20260913]
    paths:
      - .github/workflows/clarify-revit-files.yml
      - .github/clarify_revit_files.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite the public lesson and diagram
        run: python .github/clarify_revit_files.py
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node --check assets/lesson-01.js
          node --check assets/lesson-01-visuals.js
      - name: Test the public page locally
        shell: python
        run: |
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright,expect
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory='.'))
          Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto(f'http://127.0.0.1:{server.server_port}/',wait_until='networkidle')
                  initial=page.evaluate('JSON.stringify(S40.getState())')
                  page.locator('[data-tab="guide"]').click()
                  page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
                  home=page.locator('#r1-home')
                  home.locator(':scope > summary').click()
                  expect(home).to_have_attribute('open','')
                  expect(home).to_contain_text('RVT, RTE и RFA: что с ними делать')
                  expect(home).to_contain_text('рабочий файл с домом')
                  image=home.locator('.r1-topic-visual img')
                  image.evaluate('(img)=>img.loading="eager"')
                  page.wait_for_function('(img)=>img.complete&&img.naturalWidth>0',arg=image.element_handle())
                  assert image.evaluate('(img)=>img.getAttribute("src").includes("file-types.svg?v=4")')
                  assert page.evaluate('JSON.stringify(S40.getState())')==initial
                  page.set_viewport_size({'width':360,'height':900})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  assert not errors,errors
                  page.screenshot(path='clarified-revit-files.png',full_page=True)
                  browser.close()
          finally:
              server.shutdown()
      - name: Save browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: clarified-revit-files
          path: clarified-revit-files.png
          retention-days: 7
      - name: Commit the tested public files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lesson-01.js assets/lesson-01-visuals.js assets/lesson-01/file-types.svg index.html
          git commit -m 'Clarify RVT RTE and RFA with direct actions'
          git push
