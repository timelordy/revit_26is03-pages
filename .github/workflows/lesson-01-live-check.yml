name: Verify live lesson 1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lesson-01-live-check.yml
      - assets/lesson-01.js
      - assets/lesson-01.css
      - assets/lesson-01-visuals.js
      - assets/lesson-01-visuals.css
      - assets/lesson-01/**
      - index.html
      - lessons-live.js
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for the matching Pages assets
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request,urlopen
          import os,time
          root='https://timelordy.github.io/revit_26is03-pages/'
          files=[
              'assets/lesson-01.js',
              'assets/lesson-01-visuals.js',
              'assets/lesson-01-visuals.css',
              'assets/lesson-01/what-is-revit.svg',
              'assets/lesson-01/model-logic.svg',
              'assets/lesson-01/course-roadmap.svg',
          ]
          for attempt in range(30):
              try:
                  for name in files:
                      req=Request(root+name+'?verify='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urlopen(req,timeout=15) as response:
                          actual=response.read()
                      assert actual==Path(name).read_bytes(),name
                  with urlopen(root+'?verify='+os.environ['GITHUB_SHA'],timeout=15) as response:
                      html=response.read()
                  assert b'lesson-01.js?v=3' in html
                  assert b'lesson-01-visuals.js?v=5' in html
                  assert b'lesson-01-visuals.css?v=2' in html
                  print('Live Pages HTML and foundation lesson assets match the checked-out commit')
                  break
              except Exception as error:
                  if attempt==29:
                      raise
                  print('Waiting for Pages:',type(error).__name__)
                  time.sleep(10)
      - name: Check the foundation-first guide on the actual public URL
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          url='https://timelordy.github.io/revit_26is03-pages/?foundation=1'
          out=Path('lesson-01-live-qa');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              page.goto(url,wait_until='networkidle',timeout=60000)
              page.wait_for_function('window.S40 && window.S40Lesson01 && window.S40Lesson01Visuals')
              initial=page.evaluate('JSON.stringify(S40.getState())')
              page.locator('[data-tab="guide"]').click()
              page.locator('button[data-action="guide-lesson"][data-id="start"]').first.click()
              expect(page.locator('#guide-title')).to_contain_text('Revit с нуля')
              expect(page.locator('.r1-topic')).to_have_count(10)
              ids=page.locator('.r1-topic').evaluate_all('(els)=>els.map(el=>el.dataset.r1Topic)')
              assert ids[:4]==['what','model','course','home'],ids
              expect(page.locator('#r1-what')).to_contain_text('информационную модель здания')
              expect(page.locator('#r1-what')).to_contain_text('Revit и BIM — не одно и то же')
              expect(page.locator('#r1-model')).to_contain_text('Модель / Model')
              expect(page.locator('#r1-model')).to_contain_text('Параметр / Parameter')
              expect(page.locator('#r1-course')).to_contain_text('Один рабочий файл .RVT')
              expect(page.locator('.r1-summary-thumb img')).to_have_count(10)
              expect(page.locator('.r1-topic-visual img')).to_have_count(10)
              page.locator('[data-r1-expand]').click()
              page.locator('.r1-lesson img').evaluate_all('(images)=>images.forEach(img=>img.loading="eager")')
              page.wait_for_function('Array.from(document.querySelectorAll(".r1-lesson img")).every(img=>img.complete&&img.naturalWidth>0)',timeout=45000)
              assert page.locator('.r1-image-failed').count()==0
              assert page.evaluate('JSON.stringify(S40.getState())')==initial
              for width in [360,390,768,1440]:
                  page.set_viewport_size({'width':width,'height':900})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),width
              page.set_viewport_size({'width':1440,'height':1000})
              page.locator('.r1-lesson').screenshot(path=str(out/'lesson-01-foundation-live.png'))
              assert not errors,errors
              browser.close()
          print('Foundation-first Lesson 1 verified on the live site')
      - name: Save live UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-01-live-foundation-verification
          path: lesson-01-live-qa/
          retention-days: 7
